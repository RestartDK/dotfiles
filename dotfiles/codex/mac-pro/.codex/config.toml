sandbox_mode = "danger-full-access"
notify = ["/Users/danielkumlin/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[projects."/Users/danielkumlin"]
trust_level = "trusted"

[projects."/Users/danielkumlin/.dotfiles"]
trust_level = "trusted"

[projects."/Users/danielkumlin/Projects/snack"]
trust_level = "trusted"

[projects."/Users/danielkumlin/Projects/apartment-search"]
trust_level = "trusted"

[projects."/Users/danielkumlin/General/Apartment papers"]
trust_level = "trusted"

