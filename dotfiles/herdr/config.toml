onboarding = false

[worktrees]
directory = "~/.herdr/worktrees"

[ui.toast]
delivery = "system"

[ui]
agent_panel_sort = "spaces"

[theme]
name = "terminal"

[keys]
prefix = "ctrl+x"
new_workspace = "prefix+shift+n"
new_worktree = ""
switch_workspace = "prefix+1..9"
switch_tab = "prefix+alt+1..9"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+shift+l"
split_horizontal = "prefix+shift+j"
reload_config = "prefix+shift+r"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "daniel.scatterer.apply-layout"
description = "scatterer layout"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "daniel.scatterer.quick-start"
description = "scatterer quick start"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "daniel.scatterer.pr-picker"
description = "scatterer PR picker"

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = true
