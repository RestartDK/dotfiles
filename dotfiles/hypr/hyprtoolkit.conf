# Shared Hyprtoolkit palette used by Hyprlauncher.
# Official config location: ~/.config/hypr/hyprtoolkit.conf

# Neutral zinc/gray palette.
background = 0xff18181b
base = 0xff27272a
text = 0xfff4f4f5
alternate_base = 0xff3f3f46
bright_text = 0xffffffff
link_text = 0xffa1a1aa
accent = 0xff71717a
accent_secondary = 0xff52525b

rounding_large = 10
rounding_small = 6

h1_size = 19
h2_size = 15
h3_size = 13
font_size = 11
small_font_size = 10

# Used to resolve app icons from .desktop files.
icon_theme = Adwaita
font_family = Sans Serif
font_family_monospace = monospace
