# Hyprlauncher config
# Official config location: ~/.config/hypr/hyprlauncher.conf
# Supported options come from hyprlauncher's ConfigManager.

general:grab_focus = 1

cache:enabled = 1

# Desktop apps are the default provider. App icons are enabled by default,
# but keep this explicit so results reserve space for the icon at the left.
finders:default_finder = desktop
finders:desktop_icons = 1
finders:desktop_terminal = ghostty

# Other built-in providers. Type these prefixes to search them.
finders:unicode_prefix = .
finders:math_prefix = =
finders:font_prefix = '

# Comfortable centered launcher size.
ui:window_size = 640 420
