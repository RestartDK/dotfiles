# Minimal Hyprland-native lock screen.
# See: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = screenshot
    color = rgba(14, 14, 14, 1.0)
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgba(a6a6a6ff)
    inner_color = rgba(1e1e1eff)
    font_color = rgba(e6e6e6ff)
    check_color = rgba(a6a6a6ff)
    fail_color = rgba(cc6666ff)
    placeholder_text = Password
    fail_text = $PAMFAIL
    rounding = 8
    fade_on_empty = false
    dots_spacing = 0.2

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = rgba(e6e6e6ff)

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = $font
    color = rgba(a6a6a6ff)

    position = 0, 72
    halign = center
    valign = center
}
