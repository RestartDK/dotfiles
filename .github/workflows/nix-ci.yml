name: Nix CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Check and build srv-nana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v10

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build NixOS system
        run: nix build .#nixosConfigurations.srv-nana.config.system.build.toplevel --no-link --print-build-logs
