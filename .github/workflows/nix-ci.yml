name: Nix CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / NixOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.9

      - name: Check Linux outputs, formatting, and linting
        run: ./bin/traitor check --print-build-logs

      - name: Evaluate NixOS host derivation (srv-nana)
        # Evaluate the complete system derivation without materializing Nana's
        # large NVIDIA/CUDA closure on the hosted runner.
        run: nix eval --raw .#nixosConfigurations.srv-nana.config.system.build.toplevel.drvPath

  darwin:
    name: Darwin / nix-darwin
    # The flake's Darwin systems are aarch64-darwin.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.9

      - name: Check Darwin outputs, formatting, and linting
        run: ./bin/traitor check --print-build-logs

      - name: Check Darwin configurations evaluate
        run: |
          time nix eval .#darwinConfigurations.dkumlin-macbook-pro.system --apply 'x: "OK"'
          time nix eval .#darwinConfigurations.dkumlin-twin-macbook-pro.system --apply 'x: "OK"'
