name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.9

      - name: Build Nana and Hatchi
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.quality \
            .#checks.x86_64-linux.skills \
            .#checks.x86_64-linux.personal-secrets \
            .#checks.x86_64-linux.agent-profiles \
            .#checks.x86_64-linux.srv-hatchi-policy \
            .#nixosConfigurations.srv-nana.config.system.build.toplevel \
            .#nixosConfigurations.srv-hatchi.config.system.build.toplevel
