name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","lan-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space
        if: runner.environment != 'self-hosted'
        run: |
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h

      - name: Install Determinate Nix
        if: runner.environment != 'self-hosted'
        uses: DeterminateSystems/determinate-nix-action@v3.21.9
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Flake checks
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.quality \
            .#checks.x86_64-linux.pi-coordination \
            .#checks.x86_64-linux.pi-vim \
            .#checks.x86_64-linux.skills \
            .#checks.x86_64-linux.personal-secrets \
            .#checks.x86_64-linux.agent-profiles \
            .#checks.x86_64-linux.srv-hatchi-policy

  systems:
    name: build
    needs: [checks]
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","lan-ci"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: [srv-nana, srv-hatchi]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space
        if: runner.environment != 'self-hosted'
        run: |
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h

      - name: Install Determinate Nix
        if: runner.environment != 'self-hosted'
        uses: DeterminateSystems/determinate-nix-action@v3.21.9
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Build
        run: nix build --no-link --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  result:
    name: CI result
    needs: [checks, systems]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage
        run: |
          [ "${{ needs.checks.result }}" = success ]
          [ "${{ needs.systems.result }}" = success ]
