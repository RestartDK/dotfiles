name: Update flake lock

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Update flake inputs
        run: ./bin/traitor update

      - name: Format with updated inputs
        run: nix fmt

      - name: Create update PR
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412
        with:
          branch: automation/update-flake-lock
          delete-branch: true
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: |
            Updates the flake inputs and formats the source with the updated formatter.
            The lockfile and formatting changes are committed together for CI verification.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
