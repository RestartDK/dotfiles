onboarding = false

[worktrees]
directory = "~/.herdr/worktrees"

[ui.toast]
delivery = "system"

[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = false
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  [
    { token = "$pr_open", fg = "#3FB950", bold = true },
    { token = "$pr_draft", fg = "#8B949E", bold = true },
    { token = "$pr_merged", fg = "#A371F7", bold = true },
    { token = "$pr_closed", fg = "#F85149", bold = true },
  ],
]

[theme]
name = "terminal"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[keys]
prefix = "ctrl+x"
new_workspace = "prefix+shift+n"
new_worktree = ""
switch_workspace = "prefix+1..9"
switch_tab = "prefix+alt+1..9"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+shift+l"
split_horizontal = "prefix+shift+j"
reload_config = "prefix+shift+r"
goto = ""

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "daniel.scatterer.agent-picker"
description = "scatterer agent session picker"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "daniel.scatterer.apply-layout"
description = "scatterer layout"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "daniel.scatterer.quick-start"
description = "scatterer quick start"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "daniel.scatterer.pr-picker"
description = "scatterer PR picker"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "daniel.scatterer.lazygit"
description = "lazygit"

[[keys.command]]
key = "prefix+shift+f"
type = "pane"
command = "yazi"
description = "yazi file manager"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "daniel.scatterer.nav-left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "daniel.scatterer.nav-down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "daniel.scatterer.nav-up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "daniel.scatterer.nav-right"
description = "navigate right (vim/herdr)"

[experimental]
kitty_graphics = true
pane_history = false
switch_ascii_input_source_in_prefix = true
